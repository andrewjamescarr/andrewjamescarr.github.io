
name: Deploy GitHub Pages on Release

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install dependencies
        run: |
          bundle install

      - name: Generate build metadata
        run: |
          mkdir -p _data
          echo "last_commit_time: \"$(git log -1 --format=%cI)\"" > _data/build.yml
          echo "deploy_time: \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"" >> _data/build.yml
          echo "sha: \"${GITHUB_SHA}\"" >> _data/build.yml

      - name: Build Jekyll Site
        run: |
          bundle exec jekyll build -d ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
